<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SND</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="topbar">
            <div class="brand">SND</div>

            <button id="themeToggle" class="glass icon-button" aria-label="Cambiar tema">
                ◐
            </button>
        </header>

        <section class="controls">

            <div class="search-wrap glass">
                <span>⌕</span>
                <input
                    id="search"
                    type="text"
                    placeholder="Buscar"
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>

            <div class="control-row">
                <button id="favoritesToggle" class="glass control-button">
                    ☆ <span>favoritos</span>
                </button>

                <button id="overlayToggle" class="glass control-button active">
                    ◉ <span>superponer</span>
                </button>
            </div>

        </section>

        <section id="soundGrid" class="sound-grid"></section>

    </main>

    <button id="stopButton" class="stop-button" aria-label="Detener todos los sonidos">
        <span></span>
    </button>

    <script src="script.js"></script>

</body>
</html>
