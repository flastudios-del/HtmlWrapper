<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>SND</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- CABECERA -->

        <header class="header">

            <div class="brand">
                SND
            </div>

            <button
                id="themeButton"
                class="theme-button"
                aria-label="Cambiar tema"
            >
                Dark
            </button>

        </header>


        <!-- BUSCADOR -->

        <div class="search-container">

            <input
                id="searchInput"
                class="search"
                type="text"
                placeholder="Buscar"
                autocomplete="off"
                spellcheck="false"
            >

        </div>


        <!-- FILTROS -->

        <div class="filters">

            <button
                id="favoritesFilter"
                class="filter"
            >
                favoritos
            </button>

            <button
                id="overlayButton"
                class="filter"
            >
                superponer
            </button>

        </div>


        <!-- SONIDOS -->

        <section
            id="soundsGrid"
            class="sounds-grid"
        >
        </section>


        <!-- CUADRADO DE STOP -->

        <button
            id="stopAll"
            class="stop-button"
            aria-label="Detener todos los sonidos"
        >
            <span></span>
        </button>

    </main>

    <script src="sounds.js"></script>
    <script src="script.js"></script>

</body>
</html>
