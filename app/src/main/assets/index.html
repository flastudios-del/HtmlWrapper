<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SND</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">SND<span>.</span></div>
      <button id="themeBtn" class="icon-btn">◐</button>
    </header>

    <section class="hero">
      <div>
        <p>SOUNDBOARD</p>
        <h1>Tu sonido.<br><span>Al instante.</span></h1>
      </div>

      <button id="stopAll" class="stop-btn">
        ■ Detener todo
      </button>
    </section>

    <section class="controls">

      <div class="search">
        <span>⌕</span>
        <input
          id="search"
          type="search"
          placeholder="Buscar sonido..."
        >
      </div>

      <button id="overlayBtn" class="toggle">
        <span class="toggle-dot"></span>
        <span id="overlayLabel">Superponer: OFF</span>
      </button>

    </section>

    <main id="soundGrid"></main>

    <p id="empty" class="empty" hidden>
      No encontramos ese sonido.
    </p>

  </div>

  <script src="script.js"></script>

</body>
</html>
