<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#f5f5f7"
    >

    <title>SoundCore</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="brand">
            <h1>Soundboard</h1>

            <span id="soundCount">
                0 sonidos
            </span>
        </div>


        <div class="topbar-controls">

            <!-- MODO CLARO / OSCURO -->

            <button
                id="themeButton"
                class="icon-button"
                type="button"
                aria-label="Cambiar modo claro u oscuro"
            >
                ☾
            </button>


            <!-- TEMAS -->

            <button
                id="themeSelectorButton"
                class="icon-button theme-selector-button"
                type="button"
                aria-label="Cambiar tema"
            >
                🎨
            </button>

        </div>

    </header>


    <main>

        <!-- BUSCADOR -->

        <div class="search-container">

            <input
                id="searchInput"
                type="search"
                placeholder="Buscar sonidos..."
                autocomplete="off"
                spellcheck="false"
            >

            <button
                id="clearSearch"
                class="clear-search"
                type="button"
                aria-label="Limpiar búsqueda"
            >
                ×
            </button>

        </div>


        <!-- CONTROLES -->

        <div class="controls">

            <div class="tabs">

                <button
                    class="tab active"
                    data-view="all"
                    type="button"
                >
                    Todos
                </button>

                <button
                    class="tab"
                    data-view="favorites"
                    type="button"
                >
                    Favoritos
                </button>

            </div>


            <div class="capsule-controls">

                <!-- SUPERPOSICIÓN -->

                <button
                    id="overlayButton"
                    class="capsule-button"
                    type="button"
                >
                    Superponer: OFF
                </button>

            </div>

        </div>


        <!-- SELECTOR DE TEMAS -->

        <div
            id="themeMenu"
            class="theme-menu hidden"
        >

            <button
                class="theme-option"
                data-theme="default"
                type="button"
            >
                Predeterminado
            </button>

            <button
                class="theme-option"
                data-theme="ocean"
                type="button"
            >
                Ocean
            </button>

            <button
                class="theme-option"
                data-theme="lime"
                type="button"
            >
                Lime
            </button>

            <button
                class="theme-option"
                data-theme="purple"
                type="button"
            >
                Purple
            </button>

        </div>


        <!-- SONIDOS -->

        <section
            id="soundGrid"
            class="sound-grid"
        ></section>


        <!-- SIN RESULTADOS -->

        <div
            id="emptyMessage"
            class="empty-message hidden"
        >
            No se encontraron sonidos.
        </div>

    </main>


    <!-- DETENER TODO -->

    <button
        id="stopButton"
        class="stop-button"
        type="button"
        aria-label="Detener todos los sonidos"
    >
        ■
    </button>


    <script src="app.js"></script>

</body>

</html>
